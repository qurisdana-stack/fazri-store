#splash.hide{opacity:0;pointer-events:none}
#splash .p{padding:26px 30px;text-align:center}
#splash .t{font-size:34px;letter-spacing:2px}
#splash .bar{width:190px;height:6px;border-radius:6px;background:rgba(255,255,255,.25);margin:16px auto 0;overflow:hidden}
#splash .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#fff,#9fd4ff);animation:load 1.9s ease-out forwards}
@keyframes load{to{width:100%}}
@media(prefers-reduced-motion:reduce){#splash .bar i{animation:none;width:100%}}
.top{position:fixed;top:calc(env(safe-area-inset-top,0px) + 10px);right:12px;z-index:30}
.hb{width:46px;height:46px;border-radius:16px;border:0;color:#fff;font-size:22px;padding:0}
.wrap{max-width:560px;margin:0 auto;padding:68px 14px 14px}
h2{margin:6px 0 10px;font-size:20px;text-shadow:0 2px 6px rgba(0,0,0,.4)}
.hero{padding:26px 16px;text-align:center}
.hero h1{margin:0;font-size:27px;letter-spacing:1px;line-height:1.2}
.hero p{margin:8px 0 0;color:var(--mute)}
.warn{margin:14px 0;padding:12px;font-size:14px;border-radius:16px}
.warn b{color:var(--gold)}
.chips{display:flex;gap:8px;margin:10px 0}
.btn{border:1px solid rgba(255,255,255,.5);border-radius:16px;padding:12px;font:inherit;font-weight:800;font-size:15px;color:#fff;text-align:center;text-decoration:none;display:block;width:100%;text-shadow:0 1px 3px rgba(0,0,0,.4);background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.12) 55%,rgba(255,255,255,.2));-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:inset 0 1.5px 0 rgba(255,255,255,.8),0 6px 16px rgba(10,0,30,.3)}
.btn:active{transform:scale(.97)}
.btn.ok{background:linear-gradient(180deg,rgba(90,240,170,.7),rgba(20,150,100,.45))}
.btn.pk{background:linear-gradient(180deg,rgba(255,120,185,.75),rgba(200,40,120,.45))}
.btn.rd{background:linear-gradient(180deg,rgba(255,100,110,.7),rgba(190,30,50,.45))}
.chip{width:auto;padding:9px 18px;font-size:14px;border-radius:22px}
.chip.on{background:linear-gradient(180deg,rgba(255,120,185,.8),rgba(200,40,120,.5))}
input,textarea{width:100%;padding:12px 14px;border:1px solid rgba(255,255,255,.45);border-radius:14px;background:rgba(255,255,255,.16);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);color:#fff;font:inherit;font-size:15px;margin-bottom:8px;box-shadow:inset 0 1px 3px rgba(0,0,0,.2)}
input::placeholder,textarea::placeholder{color:rgba(255,255,255,.7)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.card{overflow:hidden;display:flex;flex-direction:column;border-radius:20px}
.card .ph{position:relative;aspect-ratio:4/3;background:rgba(0,0,0,.25) center/cover;cursor:pointer}
.disc{position:absolute;top:8px;left:8px;background:rgba(255,120,30,.9);color:#fff;font-weight:700;font-size:12px;padding:3px 9px;border-radius:12px}
.card .b{padding:10px;display:flex;flex-direction:column;gap:4px;flex:1}
.code{font-weight:800;color:#ffc2e0;font-size:14px}
.desc{font-size:12px;color:var(--mute);flex:1;white-space:pre-line;max-height:54px;overflow:hidden}
.old{text-decoration:line-through;color:var(--mute);font-size:12px}
.price{font-weight:800;color:var(--gold);font-size:16px}
.pg{display:flex;gap:6px;justify-content:center;margin:14px 0}
.pg button{width:40px;height:40px;border-radius:50%;border:1px solid rgba(255,255,255,.45);background:rgba(255,255,255,.16);color:#fff;font:inherit;-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.pg button.on{background:rgba(255,120,185,.75)}

function bind(){
  document.querySelectorAll("[data-lb]").forEach(function(e){e.onclick=function(){var p=P.filter(function(x){return x.id===e.dataset.lb})[0];if(p&&p.photos&&p.photos.length){lb={a:p.photos,i:0};showLb()}}});
  document.querySelectorAll("[data-c]").forEach(function(e){e.onclick=function(){cat=e.dataset.c;page=1;render()}});
  document.querySelectorAll("[data-pg]").forEach(function(e){e.onclick=function(){page=+e.dataset.pg;render();window.scrollTo(0,0)}});
  var qi=$("#q");if(qi)qi.oninput=function(){q=qi.value;page=1;render()};
  on("#pl",function(){if(aud.paused)aud.play().catch(function(){});else aud.pause()});
  var sk=$("#sk");if(sk){sk.oninput=function(){if(aud.duration)aud.currentTime=sk.value/100*aud.duration};upd()}
  var vl=$("#vl");if(vl)vl.oninput=function(){aud.volume=vl.value/100};
  on("#wsv",async function(){var n=$("#wn").value.replace(/\D/g,"");if(n.indexOf("0")===0)n="62"+n.slice(1);if(n.length<9){alert("Nomor tidak valid.");return}if(!db){WA=n;lsave();render();alert("Nomor disimpan.");return}try{await db.collection("config").doc("wa").set({n:n});alert("Nomor disimpan. Semua tombol Beli sekarang memakai nomor ini.")}catch(e){alert("Gagal simpan: "+(e.message||""))}});
  document.querySelectorAll("[data-sold]").forEach(function(e){e.onclick=function(){var p=P.filter(function(x){return x.id===e.dataset.sold})[0];if(p)dlg("ANDA YAKIN?","Tandai "+p.code+" sebagai SOLD? Akun akan pindah ke menu Sold.","Ya, Sold").then(function(y){if(y)put("products",p.id,Object.assign({},p,{sold:true,soldAt:Date.now()}))})}});
  document.querySelectorAll("[data-uns]").forEach(function(e){e.onclick=function(){var p=P.filter(function(x){return x.id===e.dataset.uns})[0];if(p){var o=Object.assign({},p);delete o.sold;delete o.soldAt;put("products",p.id,o)}}});
  on("#lo",ownerLogin);on("#la",adminLogin);on("#mk",makeAdmin);on("#save",save);on("#ml",memberLogin);on("#mr",memberReg);
  on("#lg",function(){session=null;editing=null;photos=[];render()});
  on("#lm",function(){me=null;render()});
  on("#cx",function(){editing=null;photos=[];render()});
  var fph=$("#fph");if(fph)fph.onchange=pick;
  document.querySelectorAll("[data-da]").forEach(function(e){e.onclick=function(){dlg("ANDA YAKIN?","Hapus akun admin ini?","Ya, hapus").then(function(y){if(y)del("admins",e.dataset.da)})}});
  document.querySelectorAll("[data-ed]").forEach(function(e){e.onclick=function(){editing=e.dataset.ed;var p=P.filter(function(x){return x.id===editing})[0];photos=(p&&p.photos)||[];render();window.scrollTo(0,0)}});
  document.querySelectorAll("[data-dl]").forEach(function(e){e.onclick=function(){dlg("ANDA YAKIN?","Hapus akun ini secara permanen?","Ya, hapus").then(function(y){if(y)del("products",e.dataset.dl)})}});
}
async function ownerLogin(){
  var u=$("#ou").value.trim().toUpperCase(),h=await sha($("#op").value);
  if(u!==OWNER_U||h!==OWNER_H){note="Username atau password owner salah.";return render()}
  session={r:"owner",u:"owner"};note="";render();
}
async function adminLogin(){
  var u=$("#au").value.trim(),h=await sha($("#ap").value);
  var a=A.filter(function(x){return x.u===u&&x.h===h})[0];
  if(!a){note="Username atau password salah.";return render()}
  session={r:"admin",u:u};note="";render();
}
async function makeAdmin(){
  var u=$("#nu").value.trim(),p=$("#np").value;
  if(!u||p.length<4){note="Isi username dan password (min 4 karakter).";return render()}
  if(A.some(function(x){return x.u===u})){note="Username sudah dipakai.";return render()}
  await put("admins","a"+Date.now(),{u:u,h:await sha(p)});note="Admin dibuat: "+u;render();
}
async function memberLogin(){
  var u=$("#mu").value.trim(),h=await sha($("#mp").value);
  if(!M.some(function(x){return x.u===u&&x.h===h})){note="Username atau password salah.";return render()}
  me=u;note="";render();
}
async function memberReg(){
  var u=$("#mu").value.trim(),p=$("#mp").value;
  if(!u||p.length<4){note="Isi username dan password (min 4 karakter).";return render()}
  if(M.some(function(x){return x.u===u})){note="Username sudah dipakai.";return render()}
  await put("members","m"+Date.now(),{u:u,h:await sha(p)});me=u;note="";render();
}
function pick(ev){
  var fs=Array.from(ev.target.files).slice(0,3);photos=[];
  Promise.all(fs.map(function(f){return new Promise(function(ok){
    var im=new Image();im.onload=function(){var s=Math.min(1,720/Math.max(im.width,im.height)),c=document.createElement("canvas");c.width=im.width*s;c.height=im.height*s;c.getContext("2d").drawImage(im,0,0,c.width,c.height);ok(c.toDataURL("image/jpeg",.55))};im.src=URL.createObjectURL(f)})})).then(function(r){photos=r;$("#th").innerHTML=r.map(function(x){return '<img src="'+x+'">'}).join("")});
}
async function save(){
  var code=$("#fc").value.trim(),price=+$("#fp").value;
  if(!code||!price){alert("Kode dan harga wajib diisi.");return}
  var o={code:code,info:$("#fi").value,price:price,disc:Math.min(90,+$("#fd").value||0),flash:$("#ff").checked,game:"Free Fire",photos:photos,by:session.u,t:Date.now()};
  var id=editing||"p"+Date.now();
  var old=P.filter(function(x){return x.id===id})[0];if(old&&old.sold){o.sold=true;o.soldAt=old.soldAt}
  try{await put("products",id,o)}
  catch(e){alert("Gagal simpan (foto terlalu besar atau tidak punya izin): "+(e.message||""));return}
  editing=null;photos=[];render();
}
function showLb(){$("#lbi").src=lb.a[lb.i];$("#lb").classList.add("on")}
$("#lbc").onclick=function(){$("#lb").classList.remove("on")};
$("#lbp").onclick=function(){lb.i=(lb.i+lb.a.length-1)%lb.a.length;showLb()};
$("#lbn").onclick=function(){lb.i=(lb.i+1)%lb.a.length;showLb()};
</script>
</body>
</html>
